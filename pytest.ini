[pytest]
testpaths = tests
python_files = test_*.py *_test.py
markers =
    api: api tests
    db: sql / database tests
    ui: appium (android) tests
    web: web tests
    e2e: e2e tests
    mutating: test changes data on the stand (always skipped on ENV=prod)
pythonpath = .
addopts = -ra --strict-markers